[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-gateway-mcp-nyan-cli"
version = "0.9.0"
description = "Standalone CLI and thin client for ChatGPT Gateway MCP Nyan."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "websockets>=12,<16",
  "playwright>=1.55,<2",
  "rich>=13,<15",
  "httpx>=0.27,<1",
  "mcp>=2.1.1,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "build>=1.2,<2"
]

[project.scripts]
gateway-cli = "gateway_cli.__main__:main"

[project.urls]
Homepage = "https://github.com/wada-qualia/chatgpt-gateway-mcp-nyan-cli"
Repository = "https://github.com/wada-qualia/chatgpt-gateway-mcp-nyan-cli"
Gateway = "https://github.com/wada-qualia/chatgpt-gateway-mcp-nyan"

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway_cli*"]

[tool.setuptools.package-data]
gateway_cli = ["release-signing-key.pub"]
